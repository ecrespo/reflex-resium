name: Release

# Push a tag matching the package version to publish:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to commit SHAs (tags are mutable); Dependabot keeps them updated.

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
      - name: Tag must match reflex_resium.__version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 - <<'EOF'
          import pathlib, re
          text = pathlib.Path("custom_components/reflex_resium/__init__.py").read_text()
          print(re.search(r'^__version__ = "([^"]+)"', text, re.M).group(1))
          EOF
          )
          echo "tag=${TAG} package=${version}"
          test "${TAG#v}" = "${version}"
      - name: Test
        run: uv run --locked pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uv run --locked --only-group dev twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-resium/
    permissions:
      id-token: write # Trusted Publishing (OIDC): no API token stored in the repo.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
