name: Release

# Push a tag matching the package version to publish:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Tag must match reflex_resium.__version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python - <<'EOF'
          import pathlib, re
          text = pathlib.Path("custom_components/reflex_resium/__init__.py").read_text()
          print(re.search(r'^__version__ = "([^"]+)"', text, re.M).group(1))
          EOF
          )
          echo "tag=${TAG} package=${version}"
          test "${TAG#v}" = "${version}"
      - name: Install and test
        run: |
          uv pip install --system -e ".[dev]"
          python -m pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-resium/
    permissions:
      id-token: write # Trusted Publishing (OIDC): no API token stored in the repo.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
