name: Release

# Push a tag matching the package version to publish:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Run every JavaScript action on the Node 24 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Actions are pinned to commit SHAs (tags are mutable); Dependabot keeps them updated.

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
      - name: Tag must match reflex_resium.__version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 - <<'EOF'
          import pathlib, re
          text = pathlib.Path("custom_components/reflex_resium/__init__.py").read_text()
          print(re.search(r'^__version__ = "([^"]+)"', text, re.M).group(1))
          EOF
          )
          echo "tag=${TAG} package=${version}"
          test "${TAG#v}" = "${version}"
      - name: Test
        run: uv run --locked pytest
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uv run --locked --only-group dev twine check --strict dist/*
      - name: Check classifiers (PyPI rejects unknown ones at upload)
        run: uv run --locked --only-group dev python scripts/check_classifiers.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-resium/
    permissions:
      id-token: write # Trusted Publishing (OIDC): no API token stored in the repo.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
